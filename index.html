<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scotland Travel Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e1117; --surface: #161b26; --surface2: #1e2535; --border: rgba(255,255,255,0.08);
    --accent: #0086e6; --accent2: #6e00a9; --text: #f0f4ff; --muted: #8892aa;
    --danger: #e8555a; --success: #4caf82; --font-display: 'Playfair Display', serif; --font-body: 'DM Sans', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }
  body { display: flex; flex-direction: column; }

  header { padding: 0.85rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .header-left h1 { font-family: var(--font-display); font-size: 1.4rem; }
  
  .tab-bar { display: flex; gap: 4px; }
  .tab-btn { font-size: 0.75rem; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout { display: grid; grid-template-columns: 330px 1fr; flex: 1; min-height: 0; overflow: hidden; }
  .panel { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 1.5rem; }
  
  #map { width: 100%; height: 100%; }

  .mode-badge {
    display: inline-block; font-size: 0.65rem; padding: 3px 10px; border-radius: 20px;
    margin-bottom: 8px; background: rgba(79,142,247,0.12); color: var(--accent);
    border: 1px solid rgba(79,142,247,0.2); letter-spacing: 0.05em; text-transform: uppercase;
  }

  /* Admin View Styles */
  #admin-view { display: none; flex: 1; overflow: hidden; }
  #admin-view.active { display: flex; }
  .admin-sidebar { width: 220px; border-right: 1px solid var(--border); overflow-y: auto; padding: 1rem; }
  .admin-main { flex: 1; overflow-y: auto; padding: 2rem; }

  .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
  .admin-card { background: var(--surface2); border-radius: 8px; overflow: hidden; position: relative; padding-bottom: 10px; border: 1px solid var(--border); }
  .admin-card img { width: 100%; height: 110px; object-fit: cover; }
  .admin-card-del { position: absolute; top: 5px; right: 5px; background: var(--danger); border: none; color: white; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 10px 16px; border-radius: 8px; background: var(--accent); color: white; display: none; z-index: 9999; }
  
  .city-list-item { padding: 10px; background: var(--surface); margin-bottom: 5px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: background 0.2s; }
  .city-list-item:hover { background: var(--surface2); }
  
  .attraction-card { cursor: pointer; transition: transform 0.2s; }
  .attraction-card:hover { transform: translateY(-2px); }

  .pin-dot { width: 12px; height: 12px; background: #4f8ef7; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(79,142,247,0.5); }
  .pin-dot.selected { background: #7e0d71; transform: scale(1.3); }
  .pin-label { color: white; font-size: 10px; font-weight: bold; text-shadow: 0 1px 3px black; margin-left: 5px; }
  .pin-row { display: flex; align-items: center; }
</style>
</head>
<body>

<header>
  <div class="header-left"><h1>Scotland <span>Travel Explorer</span></h1></div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('map')">🗺 Map</button>
    <button class="tab-btn" onclick="switchTab('admin')">📁 Manage Photos</button>
  </div>
</header>

<!-- MAP VIEW -->
<div id="map-view" class="layout">
  <aside class="panel">
    <div id="panel-hint">
        <div class="mode-badge" id="mode-badge">Explore mode</div>
        <p id="hint-text" style="font-size: 0.8rem; color: var(--muted); margin-bottom: 15px;">Click a city to see attractions. Click two to see distance.</p>
    </div>
    <div id="city-panel" style="display:none;">
      <h2 id="city-name" style="font-family: var(--font-display); margin-bottom: 5px;"></h2>
      <p id="city-desc" style="font-size: 0.8rem; color: var(--muted); margin-bottom: 10px;"></p>
      <div id="city-attractions"></div>
      <button onclick="clearSelection()" style="margin-top: 20px; color: var(--muted); background: none; border: 1px solid var(--border); padding: 5px; cursor: pointer; font-size: 0.7rem;">Clear Selection</button>
    </div>
    <div id="route-panel" style="display:none;">
        <h2 id="route-city1"></h2> → <h2 id="route-city2"></h2>
        <div style="background:var(--surface2); padding:15px; border-radius:10px; margin-top:15px; border:1px solid var(--accent);">
            <div id="route-km" style="font-size: 1.8rem; color: var(--accent); font-weight: bold;">--</div>
            <div style="font-size: 0.6rem; text-transform: uppercase; color: var(--muted);">Kilometres</div>
        </div>
        <div style="background:var(--surface2); padding:15px; border-radius:10px; margin-top:10px; border:1px solid var(--border);">
            <div id="route-time" style="font-size: 1.5rem; color: var(--text);">--</div>
            <div style="font-size: 0.6rem; text-transform: uppercase; color: var(--muted);">Drive Time</div>
        </div>
        <button onclick="clearSelection()" style="margin-top: 20px; color: var(--muted); background: none; border: 1px solid var(--border); padding: 5px; cursor: pointer; font-size: 0.7rem;">Clear Selection</button>
    </div>
  </aside>
  <div id="map"></div>
</div>

<!-- ADMIN VIEW -->
<div id="admin-view" class="layout">
  <aside class="admin-sidebar">
    <p style="font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px;">Cities</p>
    <div id="admin-city-list"></div>
    <button onclick="openAddCity()" style="width: 100%; margin-top: 15px; padding: 8px; border: 1px dashed var(--border); background: transparent; color: var(--muted); cursor: pointer;">+ Add City</button>
  </aside>
  <main class="admin-main" id="admin-main">
    <div style="text-align: center; margin-top: 100px; color: var(--muted);">Select a city on the left to manage its content.</div>
  </main>
</div>

<!-- Modal for New City -->
<div id="city-modal" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: var(--surface); padding: 30px; border-radius: 12px; width: 320px;">
        <h3 style="font-family: var(--font-display);">Add a Scottish City</h3>
        <input type="text" id="city-input" placeholder="e.g. Oban" style="width: 100%; padding: 10px; margin: 20px 0; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 6px;">
        <div style="display: flex; gap: 10px;">
            <button onclick="submitAddCity()" style="flex: 1; padding: 10px; background: var(--accent); border: none; color: white; border-radius: 6px; cursor: pointer;">Add City</button>
            <button onclick="closeAddCity()" style="flex: 1; padding: 10px; background: var(--surface2); border: none; color: white; border-radius: 6px; cursor: pointer;">Cancel</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
let cities = [], selected = [], routeLine = null, map;
let attractionMarkers = [], markerEls = {}, attractionMarkerMap = {};

async function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((b) => {
    b.classList.toggle("active", b.innerText.toLowerCase().includes(tab));
  });
  document.getElementById("map-view").style.display = tab === "map" ? "flex" : "none";
  document.getElementById("admin-view").classList.toggle("active", tab === "admin");
  if (tab === "admin") { loadAdminSidebar(); }
  if (tab === "map" && map) setTimeout(() => map.invalidateSize(), 100);
}

async function initMap() {
  map = L.map("map", { zoomControl: true, minZoom: 5, maxZoom: 14 }).setView([56.8, -4.2], 6);
  L.tileLayer("https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg").addTo(map);
  L.tileLayer("https://tiles.stadiamaps.com/tiles/stamen_toner_labels/{z}/{x}/{y}.png", { opacity: 0.6 }).addTo(map);
  await refreshAllData();
}

function updatePins() {
  cities.forEach(c => {
    if (!markerEls[c.id]) {
        const wrap = document.createElement("div");
        const row = document.createElement("div"); row.className = "pin-row";
        const dot = document.createElement("div"); dot.className = "pin-dot";
        const lbl = document.createElement("div"); lbl.className = "pin-label";
        lbl.textContent = c.name;
        row.append(dot, lbl); wrap.append(row);
        
        const marker = L.marker([c.lat, c.lng], { 
            icon: L.divIcon({ className: "", html: wrap, iconSize: [100, 30], iconAnchor: [6, 6] }) 
        }).addTo(map);
        marker.on("click", () => handleClick(c.id));
        markerEls[c.id] = dot;
    }
    markerEls[c.id].classList.toggle("selected", selected.includes(c.id));
  });
}

function handleClick(id) {
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
  } else if (selected.length < 2) {
    selected.push(id);
  } else {
    selected = [id];
  }
  updatePins();
  updatePanel();
  showCityAttractions();
}

function showCityAttractions() {
  attractionMarkers.forEach(m => map.removeLayer(m));
  attractionMarkers = [];
  attractionMarkerMap = {};

  if (selected.length === 1) {
    const city = cities.find(x => x.id === selected[0]);
    city.attractions.forEach(a => {
      const m = L.circleMarker([city.lat + (Math.random()-0.5)*0.02, city.lng + (Math.random()-0.5)*0.02], {
        radius: 6, color: "#e8a44a", fillOpacity: 0.9, weight: 2
      }).addTo(map);
      m.bindPopup(`<strong>${a.name}</strong><br><img src="${a.img}" width="120" style="border-radius:4px; margin-top:5px;">`);
      attractionMarkers.push(m);
      attractionMarkerMap[a._id] = m;
    });
  }
}

async function updatePanel() {
  const badge = document.getElementById("mode-badge"), hint = document.getElementById("hint-text");
  const cityP = document.getElementById("city-panel"), routeP = document.getElementById("route-panel");
  const hintBox = document.getElementById("panel-hint");

  cityP.style.display = routeP.style.display = 'none';
  hintBox.style.display = selected.length === 0 ? 'block' : 'none';

  if (selected.length === 0) {
    badge.textContent = "Explore mode"; hint.textContent = "Click a city on the map.";
    return;
  }

  if (selected.length === 1) {
    cityP.style.display = 'block';
    badge.textContent = "City view";
    const c = cities.find(x => x.id === selected[0]);
    document.getElementById("city-name").textContent = c.name;
    document.getElementById("city-desc").textContent = c.desc || "Exploring " + c.name;
    
    document.getElementById("city-attractions").innerHTML = c.attractions.map(a => `
        <div class="attraction-card" onclick="panToAttraction('${a._id}')" style="background:var(--surface2); border-radius:10px; margin-bottom:12px; border:1px solid var(--border); overflow:hidden;">
          <img src="${a.img}" style="width:100%; height:110px; object-fit:cover;">
          <div style="padding:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <strong style="font-size:0.85rem;">${a.name}</strong>
                <span style="font-size:0.6rem; color:var(--success); border:1px solid var(--success); padding:2px 5px; border-radius:4px;">${a.isTicketed ? '£'+a.price : 'FREE'}</span>
            </div>
            <p style="font-size:0.7rem; color:var(--muted); line-height:1.4;">${a.description || ''}</p>
          </div>
        </div>`).join("") || "<p style='font-size:0.7rem; color:var(--muted)'>No attractions added yet.</p>";
  }

  if (selected.length === 2) {
    routeP.style.display = 'block';
    badge.textContent = "Route view";
    const c1 = cities.find(x => x.id === selected[0]), c2 = cities.find(x => x.id === selected[1]);
    document.getElementById("route-city1").textContent = c1.name;
    document.getElementById("route-city2").textContent = c2.name;

    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline([[c1.lat, c1.lng], [c2.lat, c2.lng]], { color: "#e8a44a", dashArray: "5, 10" }).addTo(map);

    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${c1.lng},${c1.lat};${c2.lng},${c2.lat}?overview=false`);
    const data = await res.json();
    if(data.routes) {
        const km = Math.round(data.routes[0].distance / 1000);
        const mins = Math.round(data.routes[0].duration / 60);
        document.getElementById("route-km").textContent = km;
        document.getElementById("route-time").textContent = Math.floor(mins/60) + "h " + (mins%60) + "m";
    }
  }
}

function panToAttraction(id) {
    const m = attractionMarkerMap[id];
    if(m) { map.panTo(m.getLatLng()); m.openPopup(); }
}

function loadAdminSidebar() {
    const list = document.getElementById("admin-city-list");
    list.innerHTML = cities.map(c => `
        <div class="city-list-item" onclick="selectAdminCity('${c.name}')">
            ${c.name} <span style="float:right; opacity:0.5; font-size:0.6rem">${c.attractions.length}</span>
        </div>
    `).join("");
}

function selectAdminCity(name) {
    const city = cities.find(c => c.name === name);
    const main = document.getElementById("admin-main");
    main.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="font-family: var(--font-display);">Manage ${name}</h2>
        </div>
        <div style="background:var(--surface); padding:20px; border-radius:12px; margin-bottom:30px; border:1px solid var(--border);">
            <form id="uploadForm" style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <input type="text" id="attrName" placeholder="Attraction Name" required style="grid-column: span 2; padding:10px; background:var(--bg); border:1px solid var(--border); color:white; border-radius:6px;">
                <textarea id="attrDesc" placeholder="Description..." style="grid-column: span 2; padding:10px; background:var(--bg); border:1px solid var(--border); color:white; border-radius:6px; height:60px;"></textarea>
                <div style="display:flex; gap:10px; align-items:center; font-size:0.8rem;">
                    <label><input type="checkbox" id="attrTick" onchange="document.getElementById('p-wrap').style.display=this.checked?'block':'none'"> Ticketed?</label>
                    <div id="p-wrap" style="display:none">£<input type="number" id="attrPrice" placeholder="0" style="width:50px; background:transparent; border:1px solid var(--border); color:white;"></div>
                </div>
                <div style="display:flex; gap:10px; align-items:center; font-size:0.8rem;">
                    Open: <input type="time" id="attrOpen" style="background:transparent; border:1px solid var(--border); color:white;">
                    Close: <input type="time" id="attrClose" style="background:transparent; border:1px solid var(--border); color:white;">
                </div>
                <input type="file" id="attrFile" required style="grid-column: span 2; font-size:0.7rem;">
                <button type="submit" style="grid-column: span 2; background:var(--accent); color:white; border:none; padding:12px; border-radius:6px; cursor:pointer; font-weight:bold;">Save Attraction</button>
            </form>
        </div>
        <div class="admin-grid">${city.attractions.map(a => `
            <div class="admin-card">
                <img src="${a.img}">
                <div style="padding:10px;">
                    <div style="font-size:0.75rem; font-weight:bold; margin-bottom:4px;">${a.name}</div>
                    <button class="admin-card-del" onclick="deleteAttr('${city.id}', '${a._id}')">✕</button>
                </div>
            </div>`).join("")}</div>`;

    document.getElementById("uploadForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('image', document.getElementById('attrFile').files[0]);
        fd.append('name', document.getElementById('attrName').value);
        fd.append('description', document.getElementById('attrDesc').value);
        fd.append('isTicketed', document.getElementById('attrTick').checked);
        fd.append('price', document.getElementById('attrPrice').value || 0);
        fd.append('openTime', document.getElementById('attrOpen').value);
        fd.append('closeTime', document.getElementById('attrClose').value);

        showToast("Uploading to Cloud...");
        const res = await fetch(`/api/upload/${city.id}`, { method: 'POST', body: fd });
        if(res.ok) {
            showToast("Saved!", "success");
            await refreshAllData();
            selectAdminCity(name);
        }
    };
}

async function deleteAttr(cityId, attrId) {
    if(!confirm("Are you sure?")) return;
    await fetch('/api/delete-attraction', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({cityId, attractionId: attrId}) });
    await refreshAllData();
    selectAdminCity(cities.find(c => c.id === cityId).name);
}

async function refreshAllData() {
  const res = await fetch("/api/data");
  const data = await res.json();
  cities = data.cities;
  updatePins();
}

function openAddCity() { document.getElementById("city-modal").style.display = "flex"; }
function closeAddCity() { document.getElementById("city-modal").style.display = "none"; }

async function submitAddCity() {
  const input = document.getElementById("city-input");
  const name = input.value.trim();
  if(!name) return;
  await fetch("/api/city", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({name}) });
  input.value = "";
  closeAddCity();
  await refreshAllData();
  loadAdminSidebar();
  showToast("City added!");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3000);
}

function clearSelection() {
    selected = [];
    if(routeLine) map.removeLayer(routeLine);
    updatePins(); updatePanel(); showCityAttractions();
}

window.onload = initMap;
</script>
</body>
</html>
