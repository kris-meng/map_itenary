<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scotland Travel Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e1117; --surface: #161b26; --surface2: #1e2535; --border: rgba(255,255,255,0.08);
    --accent: #0086e6; --accent2: #6e00a9; --text: #f0f4ff; --muted: #8892aa;
    --danger: #e8555a; --success: #4caf82; --font-display: 'Playfair Display', serif; --font-body: 'DM Sans', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }
  body { display: flex; flex-direction: column; }

  header { padding: 0.85rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .header-left h1 { font-family: var(--font-display); font-size: 1.4rem; }
  
  .tab-bar { display: flex; gap: 4px; }
  .tab-btn { font-size: 0.75rem; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .layout { display: grid; grid-template-columns: 330px 1fr; flex: 1; min-height: 0; overflow: hidden; }
  .panel { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 1.5rem; }
  
  #map { width: 100%; height: 100%; }

  /* Admin View Styles */
  #admin-view { display: none; flex: 1; overflow: hidden; }
  #admin-view.active { display: flex; }
  .admin-sidebar { width: 220px; border-right: 1px solid var(--border); overflow-y: auto; padding: 1rem; }
  .admin-main { flex: 1; overflow-y: auto; padding: 2rem; }

  /* Form Styles */
  .admin-form { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 30px; display: grid; gap: 12px; }
  .admin-form input, .admin-form textarea { background: var(--bg); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; width: 100%; }
  
  .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
  .admin-card { background: var(--surface2); border-radius: 8px; overflow: hidden; position: relative; padding-bottom: 10px; border: 1px solid var(--border); }
  .admin-card img { width: 100%; height: 110px; object-fit: cover; }
  .del-btn { position: absolute; top: 5px; right: 5px; background: var(--danger); border: none; color: white; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; }

  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 10px 16px; border-radius: 8px; background: var(--accent); color: white; display: none; z-index: 9999; }
</style>
</head>
<body>

<header>
  <div class="header-left"><h1>Scotland <span>Travel Explorer</span></h1></div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('map')">🗺 Map</button>
    <button class="tab-btn" onclick="switchTab('admin')">📁 Manage Photos</button>
  </div>
</header>

<!-- MAP VIEW -->
<div id="map-view" class="layout">
  <aside class="panel">
    <div id="panel-hint">
        <p style="font-size: 0.8rem; color: var(--muted); margin-bottom: 15px;">Click a city to see attractions. Click two to see distance.</p>
    </div>
    <div id="city-panel" style="display:none;">
      <h2 id="city-name" style="font-family: var(--font-display); margin-bottom: 5px;"></h2>
      <div id="city-tags" style="margin-bottom: 15px;"></div>
      <div id="city-attractions"></div>
      <button onclick="clearSelection()" style="margin-top: 20px; color: var(--muted); background: none; border: 1px solid var(--border); padding: 5px; cursor: pointer; font-size: 0.7rem;">Clear</button>
    </div>
    <div id="route-panel" style="display:none;">
        <h2 id="route-city1"></h2> → <h2 id="route-city2"></h2>
        <div id="route-km" style="font-size: 2rem; color: var(--accent); font-weight: bold; margin-top: 10px;"></div>
        <p id="route-time" style="color: var(--muted);"></p>
        <button onclick="clearSelection()" style="margin-top: 20px; color: var(--muted); background: none; border: 1px solid var(--border); padding: 5px; cursor: pointer; font-size: 0.7rem;">Clear</button>
    </div>
  </aside>
  <div id="map"></div>
</div>

<!-- ADMIN VIEW -->
<div id="admin-view" class="layout">
  <aside class="admin-sidebar">
    <p style="font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px;">Cities</p>
    <div id="admin-city-list"></div>
    <button onclick="openAddCity()" style="width: 100%; margin-top: 15px; padding: 8px; border: 1px dashed var(--border); background: transparent; color: var(--muted); cursor: pointer;">+ Add City</button>
  </aside>
  <main class="admin-main" id="admin-main">
    <div style="text-align: center; margin-top: 100px; color: var(--muted);">Select a city to manage its content.</div>
  </main>
</div>

<!-- Modal for New City -->
<div id="city-modal" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: var(--surface); padding: 30px; border-radius: 12px; width: 300px;">
        <h3>Add City</h3>
        <input type="text" id="city-input" placeholder="e.g. Oban" style="width: 100%; padding: 8px; margin: 15px 0; background: var(--bg); border: 1px solid var(--border); color: white;">
        <div style="display: flex; gap: 10px;">
            <button onclick="submitAddCity()" style="flex: 1; padding: 10px; background: var(--accent); border: none; color: white; cursor: pointer;">Add</button>
            <button onclick="closeAddCity()" style="flex: 1; padding: 10px; background: var(--surface2); border: none; color: white; cursor: pointer;">Cancel</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
let cities = [], selected = [], routeLine = null, map;
let attractionMarkers = [], markerEls = {}, attractionMarkerMap = {};

// --- TAB SWITCHING (Kept Original) ---
async function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach((b, i) => {
    b.classList.toggle("active", (i === 0) === (tab === "map"));
  });
  document.getElementById("map-view").style.display = tab === "map" ? "flex" : "none";
  document.getElementById("admin-view").classList.toggle("active", tab === "admin");
  if (tab === "admin") { loadAdminSidebar(); }
  if (tab === "map" && map) setTimeout(() => map.invalidateSize(), 50);
}

// --- MAP INIT (Restored Design) ---
async function initMap() {
  map = L.map("map", { zoomControl: true, minZoom: 5, maxZoom: 14 }).setView([56.8, -4.2], 6);

  L.tileLayer("https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg").addTo(map);
  L.tileLayer("https://tiles.stadiamaps.com/tiles/stamen_toner_labels/{z}/{x}/{y}.png", { opacity: 0.6 }).addTo(map);

  await refreshAllData();
}

// --- PIN LOGIC (Restored Custom CSS Pins) ---
function updatePins() {
  cities.forEach(c => {
    if (!markerEls[c.id]) {
        const wrap = document.createElement("div"); wrap.className = "pin-wrap";
        const row = document.createElement("div"); row.className = "pin-row";
        const dot = document.createElement("div"); dot.className = "pin-dot";
        const lbl = document.createElement("div"); lbl.className = "pin-label";
        lbl.textContent = c.name;
        row.append(dot, lbl); wrap.append(row);
        
        const marker = L.marker([c.lat, c.lng], { icon: L.divIcon({ className: "", html: wrap, iconSize: [100, 30], iconAnchor: [7, 7] }) }).addTo(map);
        marker.on("click", () => handleClick(c.id));
        markerEls[c.id] = dot;
    }
    markerEls[c.id].classList.toggle("selected", selected.includes(c.id));
  });
}

function handleClick(id) {
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  } else if (selected.length < 2) {
    selected.push(id);
  } else {
    selected = [id];
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  }
  updatePins();
  updatePanel();
  showCityAttractions();
}

function showCityAttractions() {
  attractionMarkers.forEach(m => map.removeLayer(m));
  attractionMarkers = [];
  attractionMarkerMap = {};

  if (selected.length === 1) {
    const city = cities.find(x => x.id === selected[0]);
    city.attractions.forEach(a => {
      const m = L.circleMarker([city.lat + (Math.random()-0.5)*0.01, city.lng + (Math.random()-0.5)*0.01], {
        radius: 6, color: "#e8a44a", fillOpacity: 0.9
      }).addTo(map);
      m.bindPopup(`<strong>${a.name}</strong><br><img src="${a.img}" width="100">`);
      attractionMarkers.push(m);
      attractionMarkerMap[a._id] = m; // Map ID to marker for panning
    });
  }
}

// --- PANEL LOGIC (Kept Original UI Classes) ---
async function updatePanel() {
  const badge = document.getElementById("mode-badge"), hint = document.getElementById("hint-text");
  const cityP = document.getElementById("city-panel"), routeP = document.getElementById("route-panel");
  cityP.classList.remove("active"); routeP.classList.remove("active");

  if (selected.length === 0) {
    badge.textContent = "Explore mode"; hint.textContent = "Click a city on the map.";
    return;
  }

  if (selected.length === 1) {
    badge.textContent = "City view";
    const c = cities.find(x => x.id === selected[0]);
    document.getElementById("city-name").textContent = c.name;
    document.getElementById("city-desc").textContent = c.desc || "";
    
    document.getElementById("city-attractions").innerHTML = c.attractions.map(a => `
        <div class="attraction-card" onclick="panToAttraction('${a._id}')" style="margin-bottom:10px; border:1px solid var(--border); overflow:hidden;">
          <img src="${a.img}" style="width:100%; height:100px; object-fit:cover;">
          <div style="padding:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong style="font-size:0.8rem;">${a.name}</strong>
                <span style="font-size:0.6rem; color:var(--success)">${a.isTicketed ? '£'+a.price : 'FREE'}</span>
            </div>
            <p style="font-size:0.7rem; color:var(--muted); margin:5px 0;">${a.description || ''}</p>
            <div style="font-size:0.6rem; color:var(--muted);">🕒 ${a.hours?.open || ''} - ${a.hours?.close || ''}</div>
          </div>
        </div>`).join("") || "No attractions yet.";
    cityP.classList.add("active");
  }

  if (selected.length === 2) {
    badge.textContent = "Route view";
    const c1 = cities.find(x => x.id === selected[0]), c2 = cities.find(x => x.id === selected[1]);
    
    document.getElementById("route-city1").textContent = c1.name;
    document.getElementById("route-city2").textContent = c2.name;
    
    routeP.classList.add("active");
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${c1.lng},${c1.lat};${c2.lng},${c2.lat}?overview=false`);
    const data = await res.json();
    if(data.routes) {
        document.getElementById("route-km").textContent = Math.round(data.routes[0].distance / 1000);
        document.getElementById("route-time").textContent = Math.round(data.routes[0].duration / 60) + "m";
    }
  }
}

function panToAttraction(id) {
    const m = attractionMarkerMap[id];
    if(m) { map.panTo(m.getLatLng()); m.openPopup(); }
}

// --- ADMIN LOGIC (Restored Original Layout) ---
function loadAdminSidebar() {
    document.getElementById("city-list").innerHTML = cities.map(c => `
        <div class="city-list-item" onclick="selectAdminCity('${c.name}')">${c.name}</div>
    `).join("");
}

function selectAdminCity(name) {
    const city = cities.find(c => c.name === name);
    const main = document.getElementById("admin-main");
    main.innerHTML = `
        <div class="admin-main-header"><h2>Manage ${name}</h2></div>
        <div style="background:var(--surface2); padding:20px; border-radius:10px; margin-bottom:20px; border:1px solid var(--border);">
            <form id="uploadForm" style="display:grid; gap:10px;">
                <input type="text" id="attrName" placeholder="Name" required style="padding:8px; background:var(--bg); border:1px solid var(--border); color:white;">
                <textarea id="attrDesc" placeholder="Description" style="padding:8px; background:var(--bg); border:1px solid var(--border); color:white;"></textarea>
                <div style="display:flex; gap:10px;">
                    <label><input type="checkbox" id="attrTick"> Ticketed?</label>
                    <input type="number" id="attrPrice" placeholder="Price £" style="width:70px; background:var(--bg); color:white; border:1px solid var(--border);">
                </div>
                <div style="display:flex; gap:10px;">
                    Open: <input type="time" id="attrOpen" style="background:var(--bg); color:white; border:1px solid var(--border);">
                    Close: <input type="time" id="attrClose" style="background:var(--bg); color:white; border:1px solid var(--border);">
                </div>
                <input type="file" id="attrFile" required>
                <button type="submit" style="background:var(--accent); color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">Save Attraction</button>
            </form>
        </div>
        <div class="admin-grid">${city.attractions.map(a => `
            <div class="admin-card">
                <img src="${a.img}">
                <div class="admin-card-label">${a.name}</div>
                <button class="admin-card-del" onclick="deleteAttr('${city.id}', '${a._id}')">✕</button>
            </div>`).join("")}</div>`;

    document.getElementById("uploadForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('image', document.getElementById('attrFile').files[0]);
        fd.append('name', document.getElementById('attrName').value);
        fd.append('description', document.getElementById('attrDesc').value);
        fd.append('isTicketed', document.getElementById('attrTick').checked);
        fd.append('price', document.getElementById('attrPrice').value || 0);
        fd.append('openTime', document.getElementById('attrOpen').value);
        fd.append('closeTime', document.getElementById('attrClose').value);

        showToast("Uploading...");
        await fetch(`/api/upload/${city.id}`, { method: 'POST', body: fd });
        await refreshAllData();
        selectAdminCity(name);
    };
}

async function deleteAttr(cityId, attrId) {
    if(!confirm("Delete?")) return;
    await fetch('/api/delete-attraction', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({cityId, attractionId: attrId}) });
    await refreshAllData();
    const city = cities.find(c => c.id === cityId);
    selectAdminCity(city.name);
}

// --- GLOBAL HELPERS ---
async function refreshAllData() {
  const res = await fetch("/api/data");
  const data = await res.json();
  cities = data.cities;
  updatePins();
}

function openAddCity() { document.getElementById("city-modal").classList.add("open"); }
function closeAddCity() { document.getElementById("city-modal").classList.remove("open"); }
async function submitAddCity() {
  const name = document.getElementById("city-input").value;
  await fetch("/api/city", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({name}) });
  closeAddCity();
  await refreshAllData();
  loadAdminSidebar();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show";
  setTimeout(() => t.className = "", 3000);
}

function clearSelection() {
    selected = [];
    if(routeLine) map.removeLayer(routeLine);
    updatePins(); updatePanel(); showCityAttractions();
}

window.onload = initMap;
</script>
</body>
</html>
